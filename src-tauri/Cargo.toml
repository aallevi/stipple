[package]
name = "stipple"
version = "0.1.0"
description = "A stacking stippling engine"
edition = "2021"
rust-version = "1.77"

[lib]
name = "stipple_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only the formats browsers cannot decode themselves are worth pulling in.
image = { version = "0.25", default-features = false, features = ["tiff", "png", "jpeg", "bmp", "webp"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
